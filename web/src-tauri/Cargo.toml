[package]
name = "worldline"
version = "0.9.0"
description = "Worldline: calendar, habits and research projects for the Mac"
authors = ["BradenSeefeldt"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "=2.8.0"
tauri-plugin-autostart = "=2.6.0"
tauri-plugin-updater = "=2.13.0"
tauri-plugin-process = "=2.4.0"
tauri-plugin-notification = "=2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Calendars on this Mac (iCloud, Google, Exchange… through macOS's EventKit): src/eventkit.rs
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDate", "NSString", "NSError", "NSURL", "NSPredicate", "NSTimeZone", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSColorSpace"] }
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKCalendar", "EKCalendarItem", "EKObject", "EKSource", "EKTypes", "EKRecurrenceRule", "EKRecurrenceEnd", "EKRecurrenceDayOfWeek", "block2", "objc2-app-kit"] }
