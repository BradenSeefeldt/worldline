# GitHub Pages — code only; no data is ever stored here:
#   https://worldline-calendar.github.io/worldline/      the landing page (Download for Mac · Open on iPhone); with a
#                                                     scheduling link after the "#", the page guests book on (a link's
#                                                     keys live after the "#", which browsers never send to the server)
#   https://worldline-calendar.github.io/worldline/install.sh   the Terminal installer (web/scripts/install.sh)
#   https://worldline-calendar.github.io/worldline/app/  the full app for the iPhone (Add to Home Screen): it works offline
#                                                     and keeps its data on the phone; syncing goes through the relays
# Runs on every push to main that touches the web app, or by hand from the Actions tab.
name: Website

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read # (publishing to Pages is allowed for the deploy job only, below)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # in several time zones: date and time bugs often show only away from the zone the code was written in
      - name: Tests (several time zones)
        run: for z in America/Toronto UTC Asia/Tokyo Pacific/Auckland America/Los_Angeles Australia/Lord_Howe; do echo "== $z"; TZ=$z npm test || exit 1; done
      - run: npm run build:guest
      - run: npm run build:web
      - run: cp -R dist-web dist-guest/app
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist-guest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
