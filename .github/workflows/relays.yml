# Weekly relay check. Tests every relay Worldline uses for scheduling links (plus the candidates in
# web/public/relays.json) three times, 20 minutes apart. If one in use fails all three, it opens a pull request
# that swaps in the fastest working candidate — merge it, and every app and guest page picks up the new list within
# hours (the guest page within minutes); no new release needed. If something needs a human (no candidates left),
# it opens an issue instead. Run it by hand from the Actions tab any time.
name: Relay check

on:
  schedule:
    - cron: '0 13 * * 1' # Mondays, 9 AM Toronto
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false # (npm packages and the check run without a token; only the push below uses one)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci

      - id: check
        run: node scripts/check-relays.ts --write --attempts 3 --gap 20

      - name: Open (or update) a pull request with the new list
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b relays/auto-update
          # only the relay list: anything else changed by the run (a dependency's install step, say) is never committed
          git add public/relays.json
          git diff --cached --quiet && { echo "relays.json didn't change"; exit 1; }
          git commit -m "Relay list: swap out relays that stopped working"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" relays/auto-update
          gh pr create --head relays/auto-update --title "Relay list: swap out relays that stopped working" --body-file relay-report.md \
            || gh pr edit relays/auto-update --body-file relay-report.md

      - name: Ask for help if the list can't fix itself
        if: steps.check.outputs.trouble != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Relay check needs attention"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body-file relay-report.md
          fi
